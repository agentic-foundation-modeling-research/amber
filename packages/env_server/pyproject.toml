[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-scythe-env-server"
version = "0.1.0"
description = "Context Scythe rollout environment server"
authors = [{ name = "Context Scythe contributors" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "browsergym-core==0.14.3",
    "context-scythe-core==0.1.0",
    "fastapi>=0.138.1,<1.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "ray[default]>=2.55.1,<2.56.0",
    "uvicorn[standard]>=0.49.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/agentic-foundation-modeling-research/context-scythe"
Documentation = "https://github.com/agentic-foundation-modeling-research/context-scythe/tree/main/docs"
Repository = "https://github.com/agentic-foundation-modeling-research/context-scythe"
Issues = "https://github.com/agentic-foundation-modeling-research/context-scythe/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0.0",
]

[project.scripts]
context-scythe-env-server = "context_scythe.env_server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/context_scythe"]
