[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-scythe-core"
version = "0.1.0"
description = "Core functionality for Context Scythe"
authors = [{ name = "Context Scythe contributors" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "beartype==0.12.0",
    "browsergym-core==0.14.3",
    "httpx>=0.28.1,<1.0.0",
    "nltk>=3.9.4,<3.10.0",
    "openai==2.6.1",
    "anthropic==0.116.0",
    "numpy>=1.26.4,<2",
    "playwright==1.44",
    "requests>=2.34.2,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/agentic-foundation-modeling-research/context-scythe"
Documentation = "https://github.com/agentic-foundation-modeling-research/context-scythe/tree/main/docs"
Repository = "https://github.com/agentic-foundation-modeling-research/context-scythe"
Issues = "https://github.com/agentic-foundation-modeling-research/context-scythe/issues"

[project.optional-dependencies]
dev = [
    "datasets>=5.0.0,<5.1.0",
    "pytest>=9.1.1,<10.0.0",
    "tiktoken>=0.13.0,<0.14.0",
    "torch>=2.12.1,<2.13.0",
    "transformers>=4.57.0,<4.58.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/context_scythe"]
artifacts = ["src/context_scythe/templates/*.jinja"]
